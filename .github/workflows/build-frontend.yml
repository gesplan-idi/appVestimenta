name: Frontend - Build and Push

on:
  pull_request:
    branches:
      - pre
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: pre
        type: choice
        options:
          - pre
          - pro
      publish_pre:
        description: "Build and push the PRE image to ECR"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type PUBLISH_VESTIMENTA_FRONTEND_PRE to publish the PRE image"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY_PRE: gesplan-pre/vestimenta-frontend
  EXPECTED_SOURCE_REPO: gesplan-idi/appVestimenta
  INFRA_APPS_REPO: gesplan-idi/infra-apps
  DISPATCH_EVENT_TYPE: deploy-vestimenta-pre
  NODE_VERSION: "20"
  DOCKERFILE_PATH: Dockerfile

jobs:
  validate:
    name: Validate frontend build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Block PRO workflow dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'pro'
        run: |
          echo "::error::PRO deployment is not enabled yet"
          exit 1

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate repository structure
        shell: bash
        run: |
          test -f package.json
          test -f angular.json
          test -d src
          test -f "${DOCKERFILE_PATH}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate npm scripts
        shell: bash
        run: |
          npm run | grep -qE '^  build$'
          if npm run | grep -qE '^  lint$'; then
            echo "HAS_LINT=true" >> "$GITHUB_ENV"
          else
            echo "HAS_LINT=false" >> "$GITHUB_ENV"
          fi
          if npm run | grep -qE '^  test$'; then
            echo "HAS_TEST=true" >> "$GITHUB_ENV"
          else
            echo "HAS_TEST=false" >> "$GITHUB_ENV"
          fi

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Run lint
        if: env.HAS_LINT == 'true'
        run: npm run lint

      - name: Run tests
        if: env.HAS_TEST == 'true'
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Docker image
        run: docker build -f "${DOCKERFILE_PATH}" -t vestimenta-frontend:ci .

      - name: Workflow summary
        shell: bash
        run: |
          {
            echo "### Frontend CI validation"
            echo ""
            echo "- Angular build validated."
            echo "- Docker image build validated with \`${DOCKERFILE_PATH}\`."
            echo "- No ECR login or image push was executed."
            echo "- No Helm, kubectl, EKS deploy, Terraform apply or destroy was executed."
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push-pre:
    name: Build and push PRE image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pre == true
    concurrency:
      group: publish-vestimenta-frontend-pre
      cancel-in-progress: false
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Validate PRE publish request
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_PUBLISH_PRE: ${{ inputs.publish_pre }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::PRE publishing is allowed only through workflow_dispatch."
            exit 1
          fi
          if [[ "${INPUT_ENVIRONMENT}" != "pre" || "${INPUT_PUBLISH_PRE}" != "true" ]]; then
            echo "::error::PRE publishing requires environment=pre and publish_pre=true."
            exit 1
          fi
          if [[ "${INPUT_CONFIRMATION}" != "PUBLISH_VESTIMENTA_FRONTEND_PRE" ]]; then
            echo "::error::Confirmation does not match PUBLISH_VESTIMENTA_FRONTEND_PRE."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/pre" || "${GITHUB_REF_NAME}" != "pre" ]]; then
            echo "::error::PRE image publishing must run from refs/heads/pre."
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_SOURCE_REPO}" ]]; then
            echo "::error::Unexpected source repository."
            exit 1
          fi
          if [[ "${INPUT_ENVIRONMENT} ${GITHUB_REF}" == *"pro"* ]]; then
            echo "::error::PRO publishing is not enabled."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate repository structure
        shell: bash
        run: |
          test -f package.json
          test -f angular.json
          test -d src
          test -f "${DOCKERFILE_PATH}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate npm build script
        run: npm run | grep -qE '^  build$'

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Configure AWS credentials PRE
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity and ECR target PRE
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${AWS_REGION}" != "eu-west-1" || "${ECR_REPOSITORY_PRE}" != "gesplan-pre/vestimenta-frontend" ]]; then
            echo "::error::Unexpected AWS region or ECR repository for PRE."
            exit 1
          fi

          identity_json="$(aws sts get-caller-identity --output json)"
          account_id="$(jq -r '.Account' <<< "${identity_json}")"
          caller_arn="$(jq -r '.Arn' <<< "${identity_json}")"

          if [[ "${account_id}" != "674624358677" ]]; then
            echo "::error::Unexpected AWS account for PRE."
            exit 1
          fi
          case "${caller_arn}" in
            arn:aws:sts::674624358677:assumed-role/gesplan-github-actions-pre/*)
              ;;
            *)
              echo "::error::Unexpected AWS caller ARN for frontend PRE publication."
              exit 1
              ;;
          esac

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push Docker image
        id: image
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ || ! "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{40}$ || "${IMAGE_TAG}" != "sha-${GITHUB_SHA}" ]]; then
            echo "::error::Image tag must be the immutable sha-<40 lowercase hex> for GITHUB_SHA."
            exit 1
          fi
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY_PRE}:${IMAGE_TAG}"

          docker build -f "${DOCKERFILE_PATH}" -t "${IMAGE}" .
          docker push "${IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Workflow summary
        shell: bash
        run: |
          {
            echo "### Frontend image published"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Repository: \`${ECR_REPOSITORY_PRE}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo ""
            echo "Imagen publicada en ECR. Para desplegar, actualizar el tag correspondiente en infra-apps y ejecutar el workflow de despliegue desde infra-apps."
            echo ""
            echo "No se ha ejecutado Helm, kubectl, despliegue en EKS, Terraform apply ni Terraform destroy desde este repositorio."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create infra-apps dispatch token
        id: infra-apps-token
        if: ${{ success() }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INFRA_APPS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_APPS_DISPATCH_PRIVATE_KEY }}
          owner: gesplan-idi
          repositories: infra-apps

      - name: Notify infra-apps PRE deployment
        if: ${{ success() }}
        env:
          INFRA_APPS_DISPATCH_TOKEN: ${{ steps.infra-apps-token.outputs.token }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_APPS_DISPATCH_TOKEN}" ]]; then
            echo "::error::GitHub App token was not generated."
            exit 1
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ || ! "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{40}$ || "${IMAGE_TAG}" != "sha-${GITHUB_SHA}" ]]; then
            echo "::error::Image tag must equal sha-GITHUB_SHA with 40 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_SOURCE_REPO}" || "${GITHUB_REF_NAME}" != "pre" ]]; then
            echo "::error::Dispatch source must be ${EXPECTED_SOURCE_REPO} branch pre."
            exit 1
          fi
          if [[ "${INFRA_APPS_REPO}" != "gesplan-idi/infra-apps" || "${DISPATCH_EVENT_TYPE}" != "deploy-vestimenta-pre" ]]; then
            echo "::error::Unexpected dispatch destination or event type."
            exit 1
          fi

          payload="$(jq -n \
            --arg event_type "${DISPATCH_EVENT_TYPE}" \
            --arg environment "pre" \
            --arg component "frontend" \
            --arg image_tag "${IMAGE_TAG}" \
            --arg source_repo "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg source_branch "${GITHUB_REF_NAME}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            '{
              event_type: $event_type,
              client_payload: {
                environment: $environment,
                component: $component,
                image_tag: $image_tag,
                source_repo: $source_repo,
                source_sha: $source_sha,
                source_branch: $source_branch,
                source_run_id: $source_run_id
              }
            }')"

          curl --fail-with-body --show-error --silent \
            --request POST \
            --url "https://api.github.com/repos/${INFRA_APPS_REPO}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_APPS_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}"

          {
            echo ""
            echo "Repository dispatch enviado a \`gesplan-idi/infra-apps\` con GitHub App para desplegar \`${IMAGE_TAG}\` en PRE."
          } >> "$GITHUB_STEP_SUMMARY"
